name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: esgi-2603-my-favorite-places/server/yarn.lock

      - name: Installation des dépendances serveur
        working-directory: esgi-2603-my-favorite-places/server
        run: yarn install

      - name: Exécution des tests
        working-directory: esgi-2603-my-favorite-places/server
        run: yarn test

  build-and-push:
    name: Build & Push Docker images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion au GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image serveur
        uses: docker/build-push-action@v5
        with:
          context: ./esgi-2603-my-favorite-places/server
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/mfp-server:main
            ghcr.io/${{ steps.owner.outputs.name }}/mfp-server:latest
